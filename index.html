<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamilton Air Quality</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --crit: #d03b3b; --flag-text: #b32d2d;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10); --wash: rgba(255,255,255,.07);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --crit: #d03b3b; --flag-text: #ee6a6a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10); --wash: rgba(255,255,255,.07);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --crit: #d03b3b; --flag-text: #ee6a6a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  h3 { font-size: 16px; margin: 0; }
  p { margin: 0; }
  .lede { color: var(--ink2); }
  .muted, .sub, .note, .when, .unit { color: var(--ink2); }
  .sub { font-size: 13px; margin-top: 2px; }
  .note { font-size: 13px; margin-top: 8px; }
  .status { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; margin-top: 16px; }

  /* filter row */
  .filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 20px 0 16px; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .group > .label { font-size: 13px; color: var(--ink2); margin-right: 2px; }
  button, select { font: inherit; color: var(--ink); }
  .seg, .chip {
    background: transparent; border: 1px solid var(--ring); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  }
  .seg:hover, .chip:hover, .link-btn:hover { background: var(--wash); }
  .seg.on { border-color: var(--ink2); font-weight: 600; }
  .chip:not(.on) { color: var(--ink2); }
  .chip:not(.on) .key { opacity: .35; }
  .chip.on { border-color: var(--ink2); }
  .check { font-weight: 700; margin-right: 4px; }
  select { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 8px; }
  button:focus-visible, select:focus-visible, svg.chart:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  .key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex: none; vertical-align: middle; }

  /* cards */
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 8px; }
  .link-btn { background: none; border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--ink2); text-decoration: underline; flex: none; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 16px; }

  /* hero */
  .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; }
  .hero-value { font-size: 56px; line-height: 1; font-weight: 700; }
  .hero-label { font-weight: 600; }
  .hero-detail { margin-top: 8px; color: var(--ink2); }

  /* charts */
  .chart-host { position: relative; }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .cross { stroke: var(--axis); stroke-width: 1; }
  .overlay { fill: transparent; touch-action: pan-y; cursor: crosshair; }
  .guide { stroke: var(--crit); stroke-width: 1; }
  .guide-label { fill: var(--ink2); font-size: 11px; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring);
    border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12); font-size: 13px; white-space: nowrap; z-index: 2;
  }
  .tooltip[hidden] { display: none; }
  .tip-head { color: var(--ink2); margin-bottom: 4px; }
  .tip-row { display: flex; align-items: center; gap: 8px; }
  .tip-row strong { min-width: 5.5em; }
  .tip-name { color: var(--ink2); }
  .empty { color: var(--ink2); padding: 32px 0; text-align: center; }

  /* tables */
  .table-scroll { overflow-x: auto; max-height: 340px; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  thead th { color: var(--ink2); font-weight: 600; font-size: 13px; position: sticky; top: 0; background: var(--surface); }
  th[scope="row"] { font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums;
